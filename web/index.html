<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>menged — መንገድ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link href="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div id="map"></div>

<header id="topbar">
  <div class="brand">መንገድ <span>menged</span></div>
  <button id="btn-history" class="icon-btn" title="Trip history">☰ History</button>
</header>

<div id="chips" class="chips" hidden></div>

<button id="btn-recenter" class="map-fab" title="Recenter map" type="button">⌖</button>

<div id="card">
  <button type="button" id="card-handle" class="card-handle" title="Collapse or expand" aria-label="Collapse or expand card">
    <span class="handle-pill"></span>
  </button>

  <div id="card-peek" class="card-peek" hidden>
    <span id="peek-stats" class="peek-stats">Set pickup and destination</span>
    <span id="peek-fare" class="peek-fare"></span>
    <span class="peek-chevron" aria-hidden="true">⌃</span>
  </div>

  <div id="card-body" class="card-body">
    <div class="search-wrap" id="search-wrap" hidden>
      <button type="button" id="btn-open-search" class="search-open-btn">Search place…</button>
    </div>

    <div class="points">
      <div class="point-row" id="row-pickup" data-kind="pickup">
        <span class="dot pickup"></span>
        <span class="point-label" id="label-pickup">Tap the map to set pickup</span>
        <button class="mini-btn" id="btn-star-pickup" title="Save as place" hidden>☆</button>
        <button class="mini-btn" id="btn-clear-pickup" title="Clear" hidden>✕</button>
      </div>
      <div class="point-row" id="row-dest" data-kind="dest">
        <span class="dot dest"></span>
        <span class="point-label" id="label-dest">…then the destination</span>
        <button class="mini-btn" id="btn-star-dest" title="Save as place" hidden>☆</button>
        <button class="mini-btn" id="btn-clear-dest" title="Clear" hidden>✕</button>
      </div>
      <div class="point-tools">
        <button class="icon-btn" id="btn-locate" title="Use my location">◎</button>
        <button class="icon-btn" id="btn-swap" title="Swap pickup and destination">⇅</button>
        <button class="icon-btn" id="btn-reset" title="Clear pins">⌫</button>
      </div>
    </div>

    <div id="result" class="result" hidden>
      <div id="result-spinner" class="spinner-row" hidden>
        <span class="spinner"></span> Finding route…
      </div>
      <div id="result-error" class="error-row" hidden>
        <span id="result-error-msg">Routing failed.</span>
        <button id="btn-retry" class="mini-btn">Retry</button>
      </div>
      <div id="result-body" hidden>
        <div class="action-row">
          <div class="stats"><span id="stat-km">–</span> · <span id="stat-min">–</span></div>
          <div class="multipliers" id="multipliers" role="group" aria-label="Fare multiplier">
            <button type="button" data-m="1" class="on">×1</button>
            <button type="button" data-m="1.25">×1.25</button>
            <button type="button" data-m="1.5">×1.5</button>
          </div>
          <div class="fare-block">
            <span class="fare-label">Suggested</span>
            <span class="fare" id="stat-fare">–</span>
          </div>
          <button id="btn-save" class="primary btn-save">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- save-trip sheet -->
<div id="sheet-save" class="overlay" hidden>
  <div class="sheet">
    <h2>Save trip</h2>
    <label>Amount charged (<span id="save-currency">ETB</span>)
      <input id="save-amount" type="number" inputmode="decimal" step="any">
    </label>
    <label>Note <span class="muted">optional</span>
      <input id="save-note" type="text" placeholder="passenger, waited 20 min, …">
    </label>
    <div class="sheet-actions">
      <button id="btn-save-cancel">Cancel</button>
      <button id="btn-save-confirm" class="primary">Save</button>
    </div>
  </div>
</div>

<!-- history panel -->
<div id="history" class="panel" hidden>
  <header>
    <button id="btn-history-back" class="icon-btn">←</button>
    <div class="brand">History</div>
    <a id="csv-link" href="/api/trips.csv" download>Export CSV</a>
  </header>
  <div class="totals" id="history-totals"></div>
  <ul id="history-list" class="trip-list"></ul>
  <div id="history-empty" class="muted center" hidden>No trips saved yet.</div>
</div>

<!-- edit-trip sheet -->
<div id="sheet-edit" class="overlay" hidden>
  <div class="sheet">
    <h2>Edit trip</h2>
    <div class="muted" id="edit-summary"></div>
    <label>Amount charged
      <input id="edit-amount" type="number" inputmode="decimal" step="any">
    </label>
    <label>Note
      <input id="edit-note" type="text">
    </label>
    <div class="sheet-actions">
      <button id="btn-edit-delete" class="danger">Delete</button>
      <span class="flex-spacer"></span>
      <button id="btn-edit-cancel">Cancel</button>
      <button id="btn-edit-save" class="primary">Save</button>
    </div>
  </div>
</div>

<div id="search-overlay" class="search-overlay" hidden>
  <div class="search-panel" role="dialog" aria-label="Search place">
    <div class="search-panel-head">
      <input id="place-search" type="search" placeholder="Search place…" autocomplete="off" enterkeyhint="search">
      <button type="button" id="btn-close-search" class="mini-btn" title="Close">✕</button>
    </div>
    <ul id="search-results" class="search-results"></ul>
    <div id="search-hint" class="search-hint muted">Type at least 2 characters</div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>

<script src="https://unpkg.com/maplibre-gl@^5/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>

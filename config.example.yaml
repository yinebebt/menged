fare:
  currency:         ETB
  base_fare:        100
  price_per_km:     70
  price_per_minute: 10     # 0 to ignore time
  price_per_waiting_minute: 5  # time stopped (waiting, stops); 0 hides the waiting field
  minimum_fare:     250
  rounding:         5      # nearest multiple for the final fare

routing:
  provider: ors            # or: osrm (self-hosted)
  api_key:  ${ORS_API_KEY} # from env, never commit a real key
  base_url: ""             # empty → https://api.heigit.org/openrouteservice

geocoding:
  provider: pelias         # pelias | off
  pelias_base_url: ""      # empty → https://api.heigit.org/pelias/v1

server:
  # Local / behind a reverse proxy: 127.0.0.1:8080
  # Non-loopback binds are refused unless you pass -allow-public-listen.
  listen:     127.0.0.1:8080
  db_path:    ./menged.db
  map_style:  https://tiles.openfreemap.org/styles/liberty
  signup:     true   # anyone can create an account from the sign-in sheet; false closes it
  public_url: ""     # e.g. https://menged.example.com; reset links point here (empty → http://listen)

mail:
  provider:   log    # log (write emails to the server log) | mailtrap
  api_token:  ${MAILTRAP_API_TOKEN}
  sandbox_id: 0      # non-zero: deliver into that Mailtrap testing inbox instead
  from_email: no-reply@mail.example.com   # must be on a domain verified in Mailtrap
  from_name:  menged

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lint
        run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml
